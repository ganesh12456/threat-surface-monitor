services:
  # Unified Web Service (React static files served by FastAPI backend)
  - type: web
    name: threat-surface-monitor
    env: python
    plan: free
    # Since we are using Option B, we compile the frontend locally and commit the frontend/dist folder.
    # The build command just installs python requirements for the backend.
    buildCommand: "pip install -r backend/requirements.txt"
    # Start command launches Uvicorn pointing to the app.main module inside the backend folder.
    startCommand: "cd backend && python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: APP_NAME
        value: "Website Threat Surface Monitor"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false # Set this to your Supabase connection string in the Render Dashboard
      - key: SUPABASE_URL
        sync: false # Set this to your Supabase URL
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false # Set this to your Supabase Publishable Key
      - key: SOLA_MCP_ENDPOINT
        value: "https://api.sola.security/mcp"
      - key: SOLA_MCP_CLIENT_ID
        sync: false # Set Sola MCP credentials
      - key: SOLA_MCP_CLIENT_SECRET
        sync: false
